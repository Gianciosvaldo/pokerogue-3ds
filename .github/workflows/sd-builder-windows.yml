# Runs the SD card builder zip on a real Windows machine, the way lorenzo runs it: the .bat, the
# Python download, the real upstream downloads, a full build and the copy to a folder standing in
# for the SD card. The same zip also runs on Linux, and the two sets of packs must be byte-identical,
# so a Windows build matches the packs tested in Azahar. Only the logs, build reports and pack hashes
# are kept; the packs never leave the runners.
# The zip also carries the game app, so the builder can put the packs inside one file: PokeRogue.3dsx (the packs
# as the app's RomFS) and PokeRogue.cia (an installable title). Those are checked on both runners: bundle.py's
# output byte for byte against devkitPro's mkromfs3ds and 3dsxtool, the finished files against the packs by an
# independent reader (tests/check_bundle.py) and, for the CIA on Linux, against 3DSGuy's ctrtool. None of that
# proves the files run on a console: see sd-builder/README.md.
# The Windows job also does what a user does for a newer build: extracts the zip over the folder the first run used, runs it
# (nothing may be downloaded or converted again) and runs it once more with a changed app (the app is copied again).
# One run takes about 20 minutes on each runner; Windows minutes count double on a private repo.
name: SD card builder on Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sd-builder/**"
      - "assets-pipeline/*.py"
      - "assets-pipeline/tools/dspadpcm.c"
      - "assets-pipeline/app-src/**"
      - ".github/workflows/sd-builder-windows.yml"

concurrency:
  group: sd-builder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 zip
      - name: Build the game app (the zip carries it, so the builder can put the packs inside it)
        run: |
          mkdir -p dist/game && chmod 777 dist/game
          docker run --rm -v "$PWD":/src -w /src/game devkitpro/devkitarm sh -c \
            'make -j4 && cp pokerogue.3dsx pokerogue.smdh /src/dist/game/ &&
             /opt/devkitpro/devkitARM/bin/arm-none-eabi-strip --strip-debug -o /src/dist/game/pokerogue.elf pokerogue.elf'
          ls -l dist/game
      - name: Check the bundled ARM startup stack
        run: |
          python3 game/tests/check_stack_size.py game/pokerogue.elf --usage-dir game/build
          python3 game/tests/check_stack_size.py dist/game/pokerogue.elf
      - name: bundle.py writes what devkitPro's mkromfs3ds and 3dsxtool write, byte for byte
        run: python3 sd-builder/tests/bundle_test.py --reference game/pokerogue.elf game/pokerogue.smdh
      - name: The probe app (a small test of the packs inside an app) builds
        run: docker run --rm -v "$PWD":/src -w /src/sd-builder/tests/probe devkitpro/devkitarm make
      - run: GAME_DIR=dist/game sd-builder/make-zip.sh dist && sha256sum dist/PokeRogue-SD-Builder.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PokeRogue-SD-Builder
          path: dist/PokeRogue-SD-Builder.zip

  windows:
    needs: zip
    runs-on: windows-latest
    timeout-minutes: 150
    outputs:
      hashes: ${{ steps.card.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: sd-builder/tests
      - uses: actions/download-artifact@v4
        with:
          name: PokeRogue-SD-Builder
      - name: Unzip into a folder with a space and an accent in its name
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Download folder à"
          Expand-Archive PokeRogue-SD-Builder.zip -DestinationPath $dir
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "fake sd\3ds") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "fake sd 2\3ds") | Out-Null
          "BUILDER=$dir\PokeRogue-SD-Builder" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SD=$env:RUNNER_TEMP\fake sd" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SD2=$env:RUNNER_TEMP\fake sd 2" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: First run (downloads and builds everything, loose files)
        shell: cmd
        run: call "%BUILDER%\BUILD-SD-CARD.bat" --sd "%SD%" --yes --format folder < nul
      - name: Second run (should skip everything)
        shell: cmd
        run: call "%BUILDER%\BUILD-SD-CARD.bat" --sd "%SD%" --yes --format folder < nul
      - name: Check the card
        id: card
        shell: pwsh
        run: |
          Get-ChildItem -Recurse $env:SD | Format-Table Length, FullName -AutoSize
          $hashes = @()
          foreach ($s in 'data','font','gfx','snd','bgm') {
            $p = Join-Path $env:SD "3ds\pokerogue\$s.pak"
            if (-not (Test-Path $p)) { throw "$s.pak missing" }
            $hashes += "{0}.pak {1}" -f $s, (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
          }
          $hashes
          "hashes=$($hashes -join ';')" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          if (-not (Test-Path (Join-Path $env:SD "3ds\DSP1.3dsx"))) { throw "DSP1.3dsx missing" }
          $log = Get-Content (Join-Path $env:BUILDER "build-log.txt") -Raw
          if (($log | Select-String -Pattern "=== done" -AllMatches).Matches.Count -ne 2) { throw "expected two finished runs" }
          $app = (Get-FileHash (Join-Path $env:SD "3ds\PokeRogue.3dsx") -Algorithm SHA256).Hash
          if ($app -ne (Get-FileHash (Join-Path $env:BUILDER "files\game\pokerogue.3dsx") -Algorithm SHA256).Hash) { throw "folder mode did not copy the plain app" }
      - name: Third run, on a second card (one .3dsx and one .cia, the packs inside them)
        shell: cmd
        run: call "%BUILDER%\BUILD-SD-CARD.bat" --sd "%SD2%" --yes --format both < nul
      - name: Check the one-file builds against the packs
        shell: cmd
        run: |
          dir "%SD2%\3ds" "%SD2%\cias"
          "%BUILDER%\files\runtime\python\python.exe" -I -X utf8 "%GITHUB_WORKSPACE%\repo\sd-builder\tests\check_bundle.py" "%BUILDER%\files\build\3ds\pokerogue" --3dsx "%SD2%\3ds\PokeRogue.3dsx" --cia "%SD2%\cias\PokeRogue.cia"
          if errorlevel 1 exit /b 1
          if exist "%SD2%\3ds\pokerogue\*.pak" (echo loose packs on the card of a one-file build & exit /b 1)
      - name: Update over an earlier folder, step 1 (the zip extracted again over the folder the first run used)
        shell: pwsh
        run: Expand-Archive PokeRogue-SD-Builder.zip -DestinationPath (Split-Path $env:BUILDER -Parent) -Force
      - name: Update over an earlier folder, step 2 (run it)
        shell: cmd
        run: |
          call "%BUILDER%\BUILD-SD-CARD.bat" --sd "%SD%" --yes --format folder < nul > "%RUNNER_TEMP%\update-1.txt" 2>&1
          set RC=%errorlevel%
          type "%RUNNER_TEMP%\update-1.txt"
          exit /b %RC%
      - name: Update over an earlier folder, step 3 (nothing was downloaded or converted again; then change the app)
        shell: pwsh
        run: |
          $out = Get-Content (Join-Path $env:RUNNER_TEMP 'update-1.txt') -Raw
          if ($out -cmatch 'Downloading|Unpacking|Converting') { throw 'the update run downloaded or converted something' }
          if ([regex]::Matches($out, 'already done').Count -ne 5) { throw 'the update run did not skip all five packs' }
          # What a newer zip's app looks like to the builder: the same file with different bytes
          $fs = [IO.File]::Open((Join-Path $env:BUILDER 'files\game\pokerogue.3dsx'), 'Append'); $fs.WriteByte(0); $fs.Close()
      - name: Update over an earlier folder, step 4 (run it with the changed app)
        shell: cmd
        run: |
          call "%BUILDER%\BUILD-SD-CARD.bat" --sd "%SD%" --yes --format folder < nul > "%RUNNER_TEMP%\update-2.txt" 2>&1
          set RC=%errorlevel%
          type "%RUNNER_TEMP%\update-2.txt"
          exit /b %RC%
      - name: Update over an earlier folder, step 5 (still no conversion, and the changed app reached the card)
        shell: pwsh
        run: |
          $out = Get-Content (Join-Path $env:RUNNER_TEMP 'update-2.txt') -Raw
          if ($out -cmatch 'Downloading|Unpacking|Converting') { throw 'the changed-app run downloaded or converted something' }
          if ([regex]::Matches($out, 'already done').Count -ne 5) { throw 'the changed-app run did not skip all five packs' }
          $app = Join-Path $env:BUILDER 'files\game\pokerogue.3dsx'
          if ((Get-FileHash (Join-Path $env:SD '3ds\PokeRogue.3dsx') -Algorithm SHA256).Hash -ne (Get-FileHash $app -Algorithm SHA256).Hash) { throw 'the changed app did not reach the card' }
      - name: Keep the log and build report (no packs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sd-builder-windows-log
          path: |
            ${{ env.BUILDER }}/build-log.txt
            ${{ env.BUILDER }}/files/build/3ds/pokerogue/build-report.json

  linux:
    needs: zip
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      hashes: ${{ steps.packs.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: sd-builder/tests
      - uses: actions/download-artifact@v4
        with:
          name: PokeRogue-SD-Builder
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the same library versions the zip pins, and ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q numpy==1.26.4 pillow==12.3.0 lz4==4.4.5 fonttools==4.66.0
      - name: Build without a card (SD-CARD-FILES), loose files
        run: unzip -q PokeRogue-SD-Builder.zip && python PokeRogue-SD-Builder/files/builder.py --no-sd --yes --format folder < /dev/null
      - name: Hashes
        id: packs
        run: |
          cd PokeRogue-SD-Builder/SD-CARD-FILES/3ds/pokerogue
          h=$(for s in data font gfx snd bgm; do echo "$s.pak $(sha256sum $s.pak | cut -d' ' -f1)"; done)
          echo "$h"
          echo "hashes=$(echo "$h" | paste -sd';')" >> "$GITHUB_OUTPUT"
      - name: One .3dsx and one .cia (stages are skipped, so this is the bundling alone)
        run: python PokeRogue-SD-Builder/files/builder.py --no-sd --yes --format both < /dev/null
      - name: Check them against the packs, and the .cia with ctrtool
        run: |
          B=PokeRogue-SD-Builder
          python -I repo/sd-builder/tests/check_bundle.py $B/files/build/3ds/pokerogue \
            --3dsx $B/SD-CARD-FILES/3ds/PokeRogue.3dsx --cia $B/SD-CARD-FILES/cias/PokeRogue.cia
          test -z "$(find $B/SD-CARD-FILES -name '*.pak')"
          curl -sSL --retry 4 --retry-all-errors -o ctrtool.zip \
            https://github.com/3DSGuy/Project_CTR/releases/download/ctrtool-v1.2.0/ctrtool-v1.2.0-ubuntu_x86_64.zip
          echo "d53f59baf5bad5339434af2bfc5bd2a9547978d6933e80eac5902f5a11b738b1  ctrtool.zip" | sha256sum -c -
          unzip -q ctrtool.zip -d ctrtool && chmod +x ctrtool/ctrtool
          sh repo/sd-builder/tests/ctrtool_check.sh ctrtool/ctrtool $B/SD-CARD-FILES/cias/PokeRogue.cia $B/files/build/3ds/pokerogue
      - name: Keep the log and build report (no packs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sd-builder-linux-log
          path: |
            PokeRogue-SD-Builder/build-log.txt
            PokeRogue-SD-Builder/files/build/3ds/pokerogue/build-report.json

  same-packs:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Windows and Linux packs are byte-identical
        env:
          WIN: ${{ needs.windows.outputs.hashes }}
          LIN: ${{ needs.linux.outputs.hashes }}
        run: |
          echo "windows: $WIN" | tr ';' '\n'
          echo "linux:   $LIN" | tr ';' '\n'
          [ -n "$WIN" ] && [ "$WIN" = "$LIN" ]
