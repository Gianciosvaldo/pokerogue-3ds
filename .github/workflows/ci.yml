# Runs C logic tests on host (Linux runner), the game/ host tests (game/tests/run_host_tests.sh), and builds the 3DS app in devkitPro Docker
# on every pull request and manual dispatch.
# Note: Differential tests against upstream PokeRogue require an upstream checkout
# (using setup-upstream.sh) and are run by hand.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build battle-core differential runners
        run: make -C battle-core build/turntest build/poltergeist-message-test build/optional-phase-test build/optional-phase-fixtures-test build/fusion-callback-test build/transform-callback-test build/fusion-callback-turn-test build/transform-callback-turn-test build/interlude-test build/interlude-end-test build/final-boss-test build/final-boss-form-test build/item-transfer-test build/encounter-end-test build/summon-entry-test build/helping-hand-test build/acupressure-test build/after-you-test build/suppression-test build/wide-level-test build/wide-boss-score-test build/flame-burst-test build/partner-cures-test build/attention-test build/commander-test build/move-theft-test build/berry-moves-test build/xerneas-active-test build/bad-dreams-doubles-test build/wide-substitute-test build/wide-combat-test build/stat-rearrangement-test build/quash-test build/wide-highest-stat-test build/spectral-thief-test build/hp-split-test build/ability-moves-test build/hp-cost-boosts-test build/pledge-test
      - name: Run battle entry controller tests
        run: make -C battle-core summon-entry-host-test
      - name: Run game-core tests
        run: make -C game-core test

  game-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run game/ host tests
        run: game/tests/run_host_tests.sh

  build-3ds:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build 3DS app
        run: docker run --rm -v "$PWD":/src -w /src/game devkitpro/devkitarm make
