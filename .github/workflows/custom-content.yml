# Checks of custom-core, the portable data model and history reducer of the custom content mode
# (docs/CUSTOM-CONTENT-CONTRACTS.md). The make targets run model_test, reducer_test and layout_test.
# Additive: ci.yml is untouched. custom-core has no dependency on the game or the other cores; its layout test only
# reads battle-core/gen/out/pr_enums.h, so a regenerated enum that outgrows an ID ceiling fails here.
name: Custom content

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: custom-content-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  custom-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit and layout tests (gcc)
        run: make -C custom-core unit-test
      - name: Unit and layout tests (clang)
        run: make -C custom-core CC=clang BUILD=build/clang unit-test
      - name: Unit and layout tests under AddressSanitizer and UBSan
        run: make -C custom-core san-test
      - name: Mutation check (every mutation must make a test fail)
        run: make -C custom-core mutation-test
      - name: Size report
        run: make -C custom-core report

  # Compile-only check with the 3DS toolchain image the main CI already uses (same CPU flags as game/Makefile).
  custom-core-arm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile for the 3DS CPU
        run: >
          docker run --rm -v "$PWD":/src -w /src/custom-core devkitpro/devkitarm
          sh -c 'make arm-check ARM_CC=$DEVKITARM/bin/arm-none-eabi-gcc ARM_SIZE=$DEVKITARM/bin/arm-none-eabi-size'
